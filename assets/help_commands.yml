### HELP ###
help:
  name: help
  desc: Information about the bot and a list of available commands.
  usage: /help
  example: /help
  docs: help

### SET ###
set:
  name: set
  desc: >-
    Set or change your username color. The bot shows a preview and applies it after you press
    Accept. The result has an "Undo to previous color" button.

    ### Color:
      HEX (F5DF4D), CSS name (royalblue), rgb/hsl/cmyk, "random", @user to copy their color,
      or a gradient preset name (e.g. `sunset`, `holographic`).
    ### Notes:
      - Without a top.gg vote you can change your color 2 times per 30 minutes. Voting removes
        the limit for 12 hours.
      - A preset, or copying someone's gradient, needs Server Boost and a vote, like `/gradient`.
      - The first time, the bot creates a role named "🎨 <your display name>".
  usage: /set <color>
  example: |
    - /set f5df4d
    - /set royalblue
    - /set @kaaroll99
    - /set random
  docs: set

### GRADIENT ###
gradient:
  name: gradient
  desc: >-
    Set a two-color gradient as your username color, or pick a ready-made gradient by its name.
    The bot shows a preview and applies it after you press Accept.

    ### Two colors:
      Each can be HEX, a CSS name, rgb/hsl/cmyk, "random" or @user.
    ### Preset:
      Give only a preset name, e.g. `sunset`. The field suggests the names as you type;
      see them all in `/colors` → Gradients.
    ### Notes:
      - Needs Server Boost (gradient role colors) and your top.gg vote (lasts 12 hours).
      - For one color, use `/set`.
  usage: /gradient <color> [secondary_color]
  example: |
    - /gradient f5df4d 00ff00
    - /gradient royalblue tomato
    - /gradient sunset
  docs: gradient

### HOLOGRAPHIC ###
holographic:
  name: holographic
  desc: >-
    Set Discord's holographic username style: a shimmering, iridescent color. Discord allows only
    one holographic look, so the command takes no parameters.

    ### Notes:
      - Needs Server Boost (gradient role colors) and your top.gg vote (lasts 12 hours).
      - The same as `/set holographic`.
  usage: /holographic
  example: /holographic
  docs: holographic

### MATCH ###
match:
  name: match
  desc: >-
    Get username colors that match your avatar. The bot finds up to 4 main colors of your avatar
    and shows your name in each, plus a gradient of the two main ones.

    ### How to use:
      - Press a numbered button to set that color.
      - Press the 🌈 button to set the gradient (needs Server Boost and a top.gg vote).
  usage: /match
  example: /match
  docs: match

### REMOVE ###
remove:
  name: remove
  desc: >-
    Remove your username color. The bot will remove/unassign the bot-managed color
    role from your account. This command only affects roles created and managed by the bot.

  usage: /remove
  example: /remove
  docs: remove

### SELECT ###
select:
  name: select
  desc: >-
    Pick one of the colors or gradients prepared on your server. The bot shows your name in
    each of them; choose one from the menu.

    ### Notes:
      - An admin sets the list up with `/setup select` (up to 10 positions).
      - Gradients from the list need Server Boost on the server, but no vote.
  usage: /select
  example: /select
  docs: select

### CHECK ###
check:
  name: check
  desc: >-
    Show a color in HEX, RGB, HSL and CMYK, with a preview image and up to 5 similar CSS color
    names. Your color doesn't change.

    ### Color:
      HEX, CSS name, rgb/hsl/cmyk, "random", or @user to check their color.
      Gradient presets are not supported here.
  usage: /check <color>
  example: |
    - /check #F5DF4D
    - /check royalblue
    - /check @kaaroll99
  docs: check

### COLORS ###
colors:
  name: colors
  desc: >-
    Browse CSS color names with their HEX codes, grouped by color (red, green, blue...).
    Pick a group from the menu to see its colors. Use a name or HEX with `/set`.
  usage: /colors
  example: /colors
  docs: colors

### HISTORY ###
history:
  name: history
  desc: >-
    See the last 5 colors you used on this server, newest first, including gradients and
    holographic. Press a numbered button to restore one.

    ### Notes:
      - Restoring a gradient or holographic needs Server Boost and a top.gg vote.
      - History is per server and is deleted when you leave the server.
  usage: /history
  example: /history
  docs: history

### FAVORITES ADD ###
favoritesadd:
  name: favorites add
  desc: >-
    Save a color, gradient or preset to your favorites (up to 10). Favorites belong to your
    account, so you see the same list on every server with HueTweaker.

    ### Input:
      - One color: HEX, CSS name, rgb/hsl/cmyk, "random" or @user.
      - A gradient: add `secondary_color`, or give a preset name (e.g. `sunset`) or `holographic`.
    ### Notes:
      - Saving works on any server. Using a saved gradient needs Server Boost on that server
        and your top.gg vote, like `/gradient`.
  usage: /favorites add <color> [secondary_color]
  example: |
    - /favorites add f5df4d
    - /favorites add royalblue tomato
    - /favorites add sunset
  docs: favorites-add

### FAVORITES LIST ###
favoriteslist:
  name: favorites list
  desc: >-
    Show your favorite colors and gradients with a preview of your name in each.

    ### How to use:
      - Press a numbered button to set that favorite.
      - Use the dropdown to remove one from your list.
    ### Notes:
      - A gradient favorite needs Server Boost on this server and your top.gg vote.
  usage: /favorites list
  example: /favorites list
  docs: favorites-list

### VOTE ###
vote:
  name: vote
  desc: >-
    Displays the URL for voting.

  usage: /vote
  example: /vote
  docs: vote

### FORCESET ###
forceset:
  name: force set
  desc: >-
    Set or change another member's username color, solid or gradient, right away (no preview).
    Administrators only.

    ### Parameters:
      <username> - the member.
      <color> - any color format, or a preset name (`sunset`, `holographic`).
      [secondary_color] - optional, makes a gradient.
    ### Notes:
      - No vote and no `/set` limit. A gradient still needs Server Boost.
  usage: /force set <username> <color> [secondary_color]
  example: |
    - /force set @kaaroll99 f5df4d
    - /force set @kaaroll99 royalblue tomato
  docs: force-set

### FORCEREMOVE ###
forceremove:
  name: forceremove
  desc: >-
    Remove another user's username color. The bot will remove/unassign the bot-managed
    color role from the selected user and delete that role if it exists. This command
    requires administrator privileges.

    ### Parameters:
    <user_name> - Name of the selected user

  usage: /force remove <user_name>
  example: /force remove @kaaroll99
  docs: force-remove

### FORCEPURGE ###
forcepurge:
  name: forcepurge
  desc: >-
    Delete every HueTweaker-created color role from the server. The command
    opens a confirmation dialog; after confirming, the bot reports how many roles were deleted
    and how many it could not delete (roles above the bot's own role).

    ### Notes:
      - This operation is irreversible once confirmed.
      - Requires administrator privileges.
      - The command targets roles created by HueTweaker (`🎨 <display name>`) and older roles named
        `color-<USER_ID>` (e.g. `color-512674615223517205`). Other roles are never touched.

  usage: /force purge
  example: /force purge
  docs: force-purge

### SETUP TOPROLE ###
toprole:
  name: setup toprole
  desc: >-
    Configure how HueTweaker positions color roles on the server.
    The command supports three modes:
      - `auto` moves color roles as high as the bot can manage.
      - `off` moves color roles to the bottom of the role list.
      - `custom` keeps color roles directly below the selected role.

    The `[role_name]` parameter is only used with `custom`.


    ⚠️ The command can only be executed by a user with administrator privileges.

    ### ⚠️ Important:
      - In `custom`, the chosen role is respected only up to the bot's own hierarchy.
      - If the selected role is higher than the bot can manage, HueTweaker will place the
        color roles as high as possible instead.

    ### What happens when you update the mode:
      - The bot stores the selected mode for the server.
      - Existing HueTweaker color roles are moved immediately to the new target position.

    ### 💡 Roles example:
      - [Admin]
      - [Bot]  <- bot higher role
      - [colors]  <- chosen top role
      - [color-...]

    `<mode>` - One of: `auto`, `custom`, `off`
    `[role_name]` - Role used only with `custom`

  usage: /setup toprole <mode> [role_name]
  example: |
    - /setup toprole auto
    - /setup toprole off
    - /setup toprole custom @colors
  docs: setup-toprole

### SETUP SELECT ###

setupselect:
  name: setup select
  desc: >-
    Set up the list of colors members can pick with `/select` (up to 10 positions).

    ### How to use:
      1. Press **Create color list** (first time) or **Add/Edit color on list**.
      2. Enter the position (1-10) and a color: HEX, CSS name, rgb/hsl/cmyk, or a preset name
         (e.g. `sunset`, `holographic`).
      3. Fill in the second color to make a gradient. Leave the color empty to clear the position.
    ### Notes:
      - Gradients work only on servers with Server Boost; members don't need to vote for them.
  usage: /setup select
  example: /setup select
  docs: setup-select
