#exceptions
exception: "### <:warn:1362879461468672130> The bot encountered an unexpected error."
color_format: |
  ### <:warn:1362879461468672130> Incorrect color format or the selected user does not have the color set

  Use a HEX code (__F5DF4D__), a [CSS color name](https://huetweaker.gitbook.io/docs/main/colors) (__royalblue__), rgb/hsl/cmyk, __random__ or a preset (__sunset__). [All formats](https://huetweaker.gitbook.io/docs/main/colors#color-formats)
err_50013: |
  ### <:warn:1362879461468672130> The bot does not have permissions to perform this operation.

  Error may have been caused by misconfiguration of top-role bot (`/setup toprole`).
  Notify the server administrator of the occurrence of this error.

  <:bubble:1362879391423533226> Use the `/help` command to learn how to properly configure top role.

err_role_limit: |
  ### <:warn:1362879461468672130> This server has reached Discord's limit of 250 roles.

  Ask an administrator to delete unused roles (or run `/force purge`) before setting a new color.

err_670006: |
  <:warn:1362879461468672130> **This server does not have username color gradients enabled (required Nitro boost feature is missing).**

  Please contact server administrators or ensure that the server has the necessary features enabled.

